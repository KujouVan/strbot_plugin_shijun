<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>识君 · 文风与人物关系</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="identity"><span class="seal" aria-hidden="true">识</span><div><h1>识君</h1><p>文风与人物关系配置</p></div></div><div class="actions"><span id="saveState" role="status">正在连接</span><button id="reload" type="button">重新载入</button><button id="save" class="primary" type="button" disabled>保存配置</button></div></header>
<p id="error" class="error" role="alert" hidden></p>
<main>
<aside><button class="nav active" id="globalTab" type="button"><span>全局文风</span><small>内置简短毒舌</small></button><div class="listTitle"><h2>人物关系 <span id="count">0</span></h2><button id="add" class="subtle" type="button" aria-label="新增人物">＋ 新增</button></div><label class="search"><span class="sr">搜索人物</span><input id="search" placeholder="搜索备注或 QQ 号" type="search"></label><div id="people"></div><p class="sideNote">按真实发送者 QQ 匹配。<br>同一人在群聊和私聊中使用同一套关系。</p></aside>
<section class="workspace">
<div id="globalPane"><div class="sectionHead"><div><p class="context">所有未单独设置的人</p><h2>全局文风设置</h2></div><label class="toggle"><input id="enabled" type="checkbox"> 启用识君</label></div><p class="intro">默认使用简短毒舌文风，日常回复简短、自然吐槽，严肃或专业问题允许展开。人物专属要求可以覆盖全局文风。</p>
<label for="injection">提示词强化</label><select id="injection"><option value="reinforced">强化：系统末尾规则 ＋ 本轮消息提醒</option><option value="system">标准：仅系统末尾规则</option></select><p class="hint">尽量在其他插件之后注入。强化方式影响实际注入位置，不是模型数值权重。</p>
<label for="stylePrompt">自定义全局文风 <span class="optional">可留空</span></label><textarea id="stylePrompt" rows="7" maxlength="16000" placeholder="留空即使用原版简短毒舌。填写后替换全局默认文风。"></textarea>
<details><summary>查看内置简短毒舌 prompt</summary><pre id="defaultStyle"></pre></details></div>
<div id="personPane" hidden><div class="sectionHead"><div><p class="context">只对这个人使用</p><h2 id="personTitle">新人物</h2></div><label class="toggle"><input id="personEnabled" type="checkbox"> 启用关系</label></div><div class="two"><div><label for="qq">QQ 号 <span class="required">必填</span></label><input id="qq" inputmode="numeric" maxlength="20" placeholder="填写真实 QQ 号"></div><div><label for="label">备注名</label><input id="label" maxlength="80" placeholder="方便你在列表中找到他"></div></div><div class="two"><div><label for="relation">与角色的关系</label><input id="relation" maxlength="500" placeholder="例如：老朋友、家人、搭档"></div><div><label for="address">角色怎么称呼他</label><input id="address" maxlength="80" placeholder="例如：阿林、哥哥"></div></div>
<label for="mode">这个人的文风</label><select id="mode"><option value="inherit">沿用全局文风，专属要求覆盖冲突部分</option><option value="replace">完全替换全局文风，只用专属要求</option></select><p id="modeHint" class="hint"></p>
<label for="personPrompt">专属要求 <span class="optional">优先于全局与其他同类要求</span></label><textarea id="personPrompt" rows="8" maxlength="8000" placeholder="例如：对他温柔一点，不毒舌；称呼阿林。他认真提问时耐心展开，不限制三句话。"></textarea><div class="personFoot"><p class="hint">关系设定不改变管理权限或工具权限。</p><button id="delete" type="button" class="danger">删除人物</button></div></div>
<section class="preview"><div class="previewHead"><div><h3>提示词预览</h3><p class="hint">预览当前草稿，不调用模型，也不向 QQ 发消息。</p></div><button id="preview" type="button">预览提示词</button></div><label for="previewQQ">用这个 QQ 号检查匹配</label><input id="previewQQ" inputmode="numeric" placeholder="留空查看全局规则"><p id="matchResult" role="status"></p><pre id="previewText" hidden></pre></section>
</section></main><footer>专属要求优先，其次是关系与称呼、全局文风。模型的实际遵循仍以回复为准。</footer>
<dialog id="confirmDialog" aria-labelledby="confirmText"><p id="confirmText"></p><div class="actions"><button id="cancelConfirm" type="button">取消</button><button id="acceptConfirm" class="primary" type="button">确认</button></div></dialog>
<script src="/api/plugin/page/bridge-sdk.js"></script><script src="app.js"></script></body></html>
